name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing version tag to release (for example v1.3.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag_name }}' } else { '${{ github.ref_name }}' }
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $backendVersion = (Select-String -Path backend/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $desktopVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne "v$packageVersion" -or $packageVersion -ne $tauriVersion -or $packageVersion -ne $backendVersion -or $packageVersion -ne $desktopVersion) {
            throw "Release version mismatch: tag=$tag package=$packageVersion tauri=$tauriVersion backend=$backendVersion desktop=$desktopVersion"
          }

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck and lint
        run: |
          pnpm typecheck
          pnpm lint

      - name: Test frontend
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: backend

      - name: Check Tauri Rust formatting
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Check Tauri Rust build
        run: cargo check --locked
        working-directory: src-tauri

      - name: Test Rust workspace
        run: cargo test --workspace --locked
        working-directory: backend

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: backend

  release:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install webview2
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
          Start-Process "$env:TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList "/install" -Wait

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend sidecars
        run: cd backend && cargo build --release -p soloup-server -p soloup-mcp

      # 必须先产出前端静态文件：下一步的 copy-sidecars.mjs 要把 apps/web/out
      # 复制到 src-tauri/resources/web，若此时 out 还不存在，它只会打一条
      # warning 然后跳过，安装包里就会少掉 web 目录 —— 桌面版于是无法对外
      # 提供局域网页面（手机扫码打不开）。tauri build 的 beforeBuildCommand
      # 虽然也会构建前端，但那发生在复制之后，来不及。
      - name: Build web (static export)
        run: pnpm --filter @soloup/web build

      - name: Copy sidecars to resources
        run: node scripts/copy-sidecars.mjs

      # 硬校验：资源缺失必须让构建失败，而不是产出一个残缺的安装包。
      - name: Guard resources/web is bundled
        run: |
          if (-not (Test-Path "src-tauri/resources/web/index.html")) {
            Write-Error "src-tauri/resources/web 缺失，安装包将不含局域网页面"
            exit 1
          }
          Write-Host "resources/web 已就绪（含 index.html）"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          releaseName: "Soloup ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          releaseBody: |
            下载下方 Assets 里的 `Soloup_<version>_x64-setup.exe`，双击安装即可（Windows x64）。

            完整更新内容见仓库 [CHANGELOG.md](../blob/main/CHANGELOG.md)。
          releaseDraft: false
          prerelease: false
