[package]
name = "soloup-mcp"
version.workspace = true
edition.workspace = true

[[bin]]
name = "soloup-mcp"
path = "src/main.rs"

[dependencies]
soloup-server = { path = "../soloup-server" }
soloup-solver = { path = "../soloup-solver" }
soloup-store = { path = "../soloup-store" }
soloup-core = { path = "../soloup-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
once_cell = "1"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
clap = { version = "4", features = ["derive"] }
