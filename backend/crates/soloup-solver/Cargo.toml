[package]
name = "soloup-solver"
version.workspace = true
edition.workspace = true

[dependencies]
soloup-core = { path = "../soloup-core" }
soloup-store = { path = "../soloup-store" }
rusqlite = { version = "0.32" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
